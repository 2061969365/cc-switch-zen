name: Build and Release CC Switch Server

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-linux:
    name: Build Linux Binary (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Build release binary
        run: cargo build --release --bin cc-switch-server --manifest-path src-tauri/Cargo.toml

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/cc-switch-server dist/cc-switch-server-linux-amd64
          chmod +x dist/cc-switch-server-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cc-switch-server-linux-amd64
          path: dist/cc-switch-server-linux-amd64

  build-windows:
    name: Build Windows Binary (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Build release binary
        run: cargo build --release --bin cc-switch-server --manifest-path src-tauri/Cargo.toml

      - name: Prepare Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item -Path "src-tauri/target/release/cc-switch-server.exe" -Destination "dist/cc-switch-server-windows-amd64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cc-switch-server-windows-amd64.exe
          path: dist/cc-switch-server-windows-amd64.exe

  build-docker:
    name: Build & Push Docker Image
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux binary artifact
        uses: actions/download-artifact@v4
        with:
          name: cc-switch-server-linux-amd64

      - name: Make binary executable
        run: chmod +x cc-switch-server-linux-amd64

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case repository name
        run: |
          echo "IMAGE_REPOSITORY=ghcr.io/$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')/cc-switch-server" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.server
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:latest
            ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-docker]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            cc-switch-server-linux-amd64/cc-switch-server-linux-amd64
            cc-switch-server-windows-amd64.exe/cc-switch-server-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
